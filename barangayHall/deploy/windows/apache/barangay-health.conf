# Barangay Health Resident Profiling System — Apache (XAMPP) site.
# Included from C:\xampp\apache\conf\httpd.conf; see docs/deployment.md §4.
# PHP 8.5 itself is loaded by conf\extra\httpd-xampp.conf.

# ---- Change these three lines to match the server --------------------------
Define BRGY_ROOT  "C:/BarangayHealth/barangayHall"
Define BRGY_HOST  "kalawag2-health.local"
Define BRGY_CERTS "C:/xampp/apache/conf/barangay"
# ------------------------------------------------------------------------------

# Do not advertise versions on the LAN.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

Listen 443

# Port 80: everything moves to HTTPS (tablets need HTTPS for GPS).
<VirtualHost *:80>
    ServerName ${BRGY_HOST}
    ServerAlias *
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^([^:]+)
    RewriteRule ^ https://%1%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName ${BRGY_HOST}
    ServerAlias *
    DocumentRoot "${BRGY_ROOT}/public"

    SSLEngine on
    SSLCertificateFile "${BRGY_CERTS}/server.pem"
    SSLCertificateKeyFile "${BRGY_CERTS}/server-key.pem"
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off

    # Only public/ is served: .env, storage (backups, logs) and the source
    # code are outside the document root.
    <Directory "${BRGY_ROOT}/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Built assets have content hashes in their names: cache them for a year.
    <Directory "${BRGY_ROOT}/public/build/assets">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    # XAMPP's global /phpmyadmin alias is not part of this site. (Do not add
    # /dashboard here: it is the app's own home page.)
    RedirectMatch 404 ^/phpmyadmin(/|$)

    # Do not reveal the PHP version (also set expose_php = Off in php.ini).
    Header always unset X-Powered-By
    Header unset X-Powered-By

    ErrorLog "logs/barangay-error.log"
    CustomLog "logs/barangay-access.log" combined
</VirtualHost>
